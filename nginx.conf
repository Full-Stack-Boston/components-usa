server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compact layout lives under /compact/
    location = /compact {
        return 301 /compact/;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|webp|map)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
