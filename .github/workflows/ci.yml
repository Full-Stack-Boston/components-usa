name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:prod

      - name: Tests with coverage
        run: npm run test:coverage

      - name: Validate static sites
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  osv:
    name: Dependency scan (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan lockfile with OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=package-lock.json

  semgrep:
    name: Semgrep OSS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/typescript \
            --error \
            --metrics=off \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='coverage' \
            --exclude='**/*.min.js' \
            --exclude='**/jquery*.js' \
            --exclude='**/plugins.js' \
            --exclude='**/modernizr.js' \
            --exclude='**/*.test.js' \
            --exclude='**/flexslider*' \
            --exclude='**/waypoints*' \
            --exclude='**/magnific*' \
            --exclude='**/placeholder*' \
            --exclude='**/fittext*' \
            --exclude='**/validate*'
